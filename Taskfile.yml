version: '3'

vars:
  GO_MODULES: ./apps/control-plane ./apps/edge-agent
  EDGE_RACE_IMAGE: golang:1.27-bookworm@sha256:484ef6066fa69acb059fdfeda7ba2b8f7391f2ef6abc6f9b8411e669ebd56466

tasks:
  default:
    desc: Run the fast pre-commit lane
    deps: [check]

  check:
    desc: The fast pre-commit lane. Mirrors the `checks` workflow exactly.
    env:
      GOWORK: 'off'
    cmds:
      - node tools/check-gofmt.mjs
      - npm run format:check
      - npm run contracts:check
      - npm run generated:check
      - npm run dependencies:check
      - npm run workflow:check
      - npm run security:check
      - npm run typecheck -w @guardianpot/web-console
      - npm run lint -w @guardianpot/web-console
      - npm run test -w @guardianpot/web-console
      - npm run build -w @guardianpot/web-console
      - npm run bundle:check -w @guardianpot/web-console
      - go -C apps/control-plane vet ./...
      - go -C apps/control-plane test ./...
      # The Edge Agent's privileged package is Linux-only by design, so a
      # Windows or macOS host can compile-check it but cannot run it. CI is
      # Linux and runs the tests.
      - cmd: go -C apps/edge-agent vet ./...
        platforms: [linux]
      - cmd: go -C apps/edge-agent test ./...
        platforms: [linux]
      - cmd: GOOS=linux go -C apps/edge-agent vet ./...
        platforms: [windows, darwin]
      - cmd: echo "note - Edge Agent tests are Linux-only and were not run here. CI runs them."
        platforms: [windows, darwin]

  format:
    desc: Format Go and run repository formatting checks
    cmds:
      - gofmt -w apps/control-plane apps/edge-agent
      - npm run format:check

  format:check:
    desc: Check Go and repository formatting without changing files
    cmds:
      - node tools/check-gofmt.mjs
      - npm run format:check

  go:check:
    desc: Run Go formatting, vet, and tests for every Go module
    deps: [control-plane:generated, control-plane:tools]
    env:
      GOWORK: 'off'
    cmds:
      # Buf clean-generation rewrites the generated tree, so Edge builds start only after it completes.
      - task: privileged:generated
      - task: edge:integration
      - task: privileged:security
      - task: privileged:netlink
      - go -C apps/control-plane vet ./...
      - go -C apps/edge-agent vet ./...
      - go -C apps/control-plane test ./...
      - go -C apps/edge-agent test ./...
      - task: edge:race

  control-plane:generate:
    desc: Regenerate typed PostgreSQL access from SQL
    env:
      GOWORK: 'off'
    cmds:
      - go -C apps/control-plane/tools/sqlc tool sqlc generate -f ../../sqlc.yaml

  control-plane:generated:
    desc: Verify committed sqlc output is current
    cmds:
      - task: control-plane:generate
      - git diff --exit-code -- apps/control-plane/internal/storage/dbgen

  control-plane:tools:
    desc: Verify pinned repository-local Control Plane tools and modules
    env:
      GOWORK: 'off'
    cmds:
      - go -C apps/control-plane/tools/sqlc tool sqlc version
      - go -C apps/control-plane/tools/goose tool goose -version
      - go -C apps/control-plane mod verify
      - go -C apps/control-plane/tools/sqlc mod verify
      - go -C apps/control-plane/tools/goose mod verify

  control-plane:migrate:
    desc: Apply embedded forward-only Control Plane migrations explicitly
    env:
      GOWORK: 'off'
    cmds:
      - go -C apps/control-plane run ./cmd/control-plane migrate

  control-plane:integration:
    desc: Run disposable PostgreSQL 18 migration, persistence, and lifecycle evidence
    deps: [control-plane:generated, environment:integration, reconciliation:integration]
    cmds:
      - |
        temporary_key="$(mktemp /tmp/guardian-control-plane-master.XXXXXX)"
        cleanup_key() {
          case "$temporary_key" in
            /tmp/guardian-control-plane-master.*) rm -f -- "$temporary_key" ;;
            *) echo "refusing unexpected master-key cleanup: $temporary_key" >&2 ;;
          esac
        }
        trap cleanup_key EXIT
        head -c 32 /dev/urandom >"$temporary_key"
        chmod 600 "$temporary_key"
        GUARDIAN_MASTER_KEY_FILE="$temporary_key" \
          GUARDIAN_PUBLIC_ORIGIN="https://guardian.example.test" \
          bash tests/integration/control-plane/run.sh

  enrollment:integration:
    desc: Run durable P1-W4 enrollment, replay, rotation, revocation, and Edge identity evidence
    deps: [control-plane:generated, edge:tools]
    cmds:
      - bash tests/integration/enrollment/run.sh

  auth:integration:
    desc: Run P1-W2 PostgreSQL, TLS, MFA, recovery, session, throttle, audit, and redaction evidence
    deps: [control-plane:generated]
    cmds:
      - bash tests/integration/auth/run.sh

  environment:integration:
    desc: Run P1-W3 PostgreSQL, HTTPS, authorization, concurrency, audit, and no-scan evidence
    deps: [control-plane:generated]
    cmds:
      - bash tests/integration/environment/run.sh

  decoy:integration:
    desc: Run P2-W15 decoy domain, placement, lifecycle, audit, observed-state, and boundary evidence
    deps: [control-plane:generated]
    cmds:
      - bash tests/integration/decoy/run.sh

  edge:tools:
    desc: Verify the Edge Agent module dependency graph
    env:
      GOWORK: 'off'
    cmds:
      - go -C apps/edge-agent mod download
      - go -C apps/edge-agent mod verify

  privileged:generate:
    desc: Regenerate the typed privileged-helper Protobuf and gRPC contract
    env:
      GOWORK: 'off'
    cmds:
      - buf generate

  privileged:generated:
    desc: Verify committed privileged-helper and device-channel generated code is current
    cmds:
      - task: privileged:generate
      - git diff --exit-code -- apps/edge-agent/internal/privileged/gen apps/control-plane/internal/devicechannel/gen apps/edge-agent/internal/devicechannel/gen

  device-channel:integration:
    desc: Run P1-W5 mTLS, reconnect, revocation, bounds, and race evidence
    deps: [control-plane:generated, privileged:generated]
    cmds:
      - bash tests/integration/device-channel/run.sh

  reconciliation:integration:
    desc: Run P1-W6 PostgreSQL, SQLite, real mTLS convergence, replay, restart, retry, race, and redaction evidence
    deps: [control-plane:generated, privileged:generated, edge:tools]
    cmds:
      - bash tests/integration/reconciliation/run.sh

  privileged:security:
    desc: Run privileged-helper boundary, abuse, socket, peer, and service-profile tests
    deps: [edge:tools, privileged:generated]
    cmds:
      - bash tests/security/privileged-helper/run.sh
      - |
        docker run --rm \
          --network=none \
          --read-only \
          --tmpfs /tmp:rw,exec,nosuid,size=1g \
          --cap-drop=ALL \
          --cap-add=CHOWN \
          --cap-add=SETUID \
          --cap-add=SETGID \
          --security-opt=no-new-privileges \
          --pids-limit=256 \
          --env CGO_ENABLED=1 \
          --env GOWORK=off \
          --env GUARDIAN_ROOT_SECURITY_LAB=1 \
          --env GOMODCACHE=/go/pkg/mod \
          --env GOCACHE=/tmp/go-build \
          --env GOTMPDIR=/tmp/go-tmp \
          --env HOME=/tmp/home \
          --mount "type=bind,src={{.ROOT_DIR}}/apps/edge-agent,dst=/src,readonly" \
          --mount "type=bind,src=$(go env GOMODCACHE),dst=/go/pkg/mod,readonly" \
          --workdir /src \
          {{.EDGE_RACE_IMAGE}} \
          sh -ec 'mkdir -p /tmp/go-build /tmp/go-tmp /tmp/home && exec go test -mod=readonly -count=1 -run ^TestRootPeerAndSocketSecurity$ ./internal/privileged'

  presence:probe:
    desc: Verify the P2-W1 conflict pre-check against a live segment, unprivileged
    cmds:
      # AC-ON-004 needs an answer to "does another host already hold this
      # address". The obvious implementation is an ARP probe, which needs root
      # and a new privileged operation; this asserts the unprivileged one works
      # on a real segment, as uid 1000, against a live gateway and a free
      # address in the same subnet.
      - |
        docker run --rm           --network bridge           --user 1000:1000           --cap-drop=ALL           --security-opt=no-new-privileges           --pids-limit=256           --env GOWORK=off           --env GUARDIAN_LIVE_PROBE=1           --env GOCACHE=/tmp/go-build           --env GOMODCACHE=/go/pkg/mod           --env HOME=/tmp/home           --mount "type=bind,src={{.ROOT_DIR}}/apps/edge-agent,dst=/src,readonly"           --mount "type=bind,src=$(go env GOMODCACHE),dst=/go/pkg/mod,readonly"           --workdir /src           {{.EDGE_RACE_IMAGE}}           sh -ec 'mkdir -p /tmp/go-build /tmp/home && exec go test -mod=readonly -count=1 -run TestLiveProbe -v ./internal/presence'

  privileged:netlink:
    desc: Exercise the P2-W1 address and P2-W2 egress adapters against a live kernel in a throwaway namespace
    deps: [edge:tools, privileged:generated]
    cmds:
      # The adapter adds and removes real addresses, so it is exercised against
      # a real kernel rather than a fake. The container has its own network
      # namespace and its own eth0, both discarded when it exits, so a bug in
      # the code under test cannot reach anything outside it.
      #
      # The capability set is exactly the one the systemd unit grants:
      # CAP_NET_ADMIN and nothing else. If the adapter ever needed more, this
      # would fail here rather than in a customer's network.
      - |
        docker run --rm \
          --network bridge \
          --cap-drop=ALL \
          --cap-add=NET_ADMIN \
          --security-opt=no-new-privileges \
          --pids-limit=256 \
          --env GOWORK=off \
          --env GUARDIAN_NETLINK_LAB=1 \
          --env GOCACHE=/tmp/go-build \
          --env GOMODCACHE=/go/pkg/mod \
          --env HOME=/tmp/home \
          --mount "type=bind,src={{.ROOT_DIR}}/apps/edge-agent,dst=/src,readonly" \
          --mount "type=bind,src=$(go env GOMODCACHE),dst=/go/pkg/mod,readonly" \
          --workdir /src \
          {{.EDGE_RACE_IMAGE}} \
          sh -ec 'mkdir -p /tmp/go-build /tmp/home && exec go test -mod=readonly -count=1 -run AgainstALiveKernel -v ./internal/privileged'

  edge:race:
    desc: Run Edge Agent race tests in the pinned isolated Go builder
    deps: [edge:tools, privileged:generated]
    cmds:
      - |
        docker run --rm \
          --network=none \
          --read-only \
          --tmpfs /tmp:rw,exec,nosuid,size=1g \
          --cap-drop=ALL \
          --security-opt=no-new-privileges \
          --pids-limit=1024 \
          --env CGO_ENABLED=1 \
          --env GOWORK=off \
          --env GOMODCACHE=/go/pkg/mod \
          --env GOCACHE=/tmp/go-build \
          --env GOTMPDIR=/tmp/go-tmp \
          --env HOME=/tmp/home \
          --mount "type=bind,src={{.ROOT_DIR}}/apps/edge-agent,dst=/src,readonly" \
          --mount "type=bind,src=$(go env GOMODCACHE),dst=/go/pkg/mod,readonly" \
          --workdir /src \
          {{.EDGE_RACE_IMAGE}} \
          sh -ec 'mkdir -p /tmp/go-build /tmp/go-tmp /tmp/home && exec go test -mod=readonly -race ./...'

  edge:integration:
    desc: Run unprivileged Edge lifecycle, restart, recovery, permission, and WAL evidence
    deps: [edge:tools]
    cmds:
      - bash tests/integration/edge-agent/run.sh
      - task: edge:wal

  web:generated:
    desc: Verify the committed Web Console OpenAPI types match the contract
    cmds:
      - npm run generated:check

  web:check:
    desc: Typecheck and build the web-console workspace
    deps: [web:generated]
    dir: apps/web-console
    cmds:
      - npm run typecheck
      - npm run lint
      - npm run test
      - npm run build
      - npm run bundle:check

  web:e2e:
    desc: Run the full web gate and then the real browser onboarding path
    deps: [web:check]
    cmds:
      - task: web:e2e:run

  web:e2e:run:
    desc: Run the browser onboarding path without repeating the web gate
    deps: [control-plane:generated, privileged:generated, edge:tools]
    cmds:
      - bash tests/e2e/web-console/run.sh

  policy:
    desc: Run repository policy checks
    cmds:
      - npm run contracts:check
      - npm run security:check
      - npm run generated:check
      - npm run dependencies:check
      - npm run workflow:check

  contracts:
    desc: Validate Protobuf and OpenAPI contract tooling
    cmds:
      - task: health:contracts
      - buf lint
      - npm run openapi:check
      - npm run canonical-contracts:check

  event:contracts:
    desc: Verify canonical event parity across the schema, Control Plane, and Edge
    env:
      GOWORK: 'off'
    cmds:
      - node tests/integration/event/check-contracts.mjs
      - go -C apps/control-plane test ./internal/event
      - cmd: go -C apps/edge-agent test ./internal/normalize
        platforms: [linux]
      - cmd: GOOS=linux go -C apps/edge-agent vet ./internal/normalize
        platforms: [windows, darwin]

  health:contracts:
    desc: Verify P1-W9 canonical health contract parity and domain behavior
    env:
      GOWORK: 'off'
    cmds:
      - node tests/integration/health/check-contracts.mjs
      - go -C apps/control-plane test ./internal/health
      - go -C apps/edge-agent test ./internal/health

  health:integration:
    desc: Run P1-W9 durable health, replay, failure-recovery, and race evidence
    deps: [control-plane:generated, privileged:generated, edge:tools]
    cmds:
      - bash tests/integration/health/run.sh

  container:check:
    desc: Build and run the hardened control-plane container smoke image
    cmds:
      - docker build --file apps/control-plane/Dockerfile --tag guardian/control-plane:ci .
      - docker run --rm --network=none --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 guardian/control-plane:ci version

  lab:reset:
    desc: Reset and start the disposable isolated network lab
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/lab-reset.ps1

  lab:test:
    desc: Verify routing and management isolation in the disposable lab
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/lab-test.ps1

  lab:secondary-ip:
    desc: Run the routed secondary-IP placement and cleanup spike
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/lab-secondary-ip.ps1

  decoy:lifecycle:
    desc: Validate the containerd/runc decoy lifecycle and isolation fixture
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/decoy-lifecycle.ps1

  edge:wal:
    desc: Run the SQLite WAL crash/restart and durable replay fixture
    cmds:
      - bash tools/edge-wal-fixture.sh

  device:pki:
    desc: Run the disposable device enrollment, mTLS, rotation, and revocation fixture
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/device-pki-fixture.ps1

  cowrie:adapter:
    desc: Run the disposable Cowrie SSH adapter, event, and egress fixture
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/cowrie-fixture.ps1

  validate:
    desc: Run all local quality checks
    deps: [format:check, go:check, web:e2e, policy, contracts, container:check, control-plane:integration, enrollment:integration, auth:integration, environment:integration, device-channel:integration, health:integration, decoy:integration]

  build:
    desc: Build all skeleton applications
    deps: [go:check, web:check]

  test:
    desc: Run all skeleton tests
    deps: [go:check]
