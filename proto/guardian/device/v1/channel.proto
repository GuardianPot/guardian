syntax = "proto3";

package guardian.device.v1;

import "google/protobuf/timestamp.proto";
import "guardian/device/v1/device.proto";

option go_package = "github.com/GuardianPot/guardian/gen/go/guardian/device/v1;devicev1";

// DeviceChannel is the single authenticated Control Plane to Edge management
// stream. The peer identity is supplied exclusively by mTLS, never by a field
// in these envelopes.
service DeviceChannelService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse);
}

message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

message EdgeHello {
  ProtocolVersion protocol = 1;
  string agent_version = 2;
}

message ProtocolSelection {
  ProtocolVersion selected = 1;
  bool accepted = 2;
  string reason = 3;
}

message Heartbeat {
  google.protobuf.Timestamp sent_at = 1;
}

// EdgeConfiguration binds a snapshot to the authenticated Edge and its
// durable environment. It grants no runtime or privileged authority.
message EdgeConfiguration {
  string device_id = 1;
  string environment_id = 2;
}

// NetworkZoneMetadata is descriptive environment data. Receiving it does not
// trigger discovery, address, route, firewall, or namespace mutation.
message NetworkZoneMetadata {
  string zone_id = 1;
  string display_name = 2;
  string cidr = 3;
  uint64 source_revision = 4;
}

// PlaceholderDecoyDesiredObject proves typed evolution without introducing a
// real decoy lifecycle. It has no enabled, runtime, artifact, or action field.
message PlaceholderDecoyDesiredObject {
  string object_id = 1;
  string zone_id = 2;
  string display_name = 3;
}

message DesiredStateSnapshot {
  string message_id = 1;
  uint64 revision = 2;
  EdgeConfiguration edge_configuration = 3;
  repeated NetworkZoneMetadata zones = 4;
  repeated PlaceholderDecoyDesiredObject placeholder_decoys = 5;
}

enum ReconciliationConditionStatus {
  RECONCILIATION_CONDITION_STATUS_UNSPECIFIED = 0;
  RECONCILIATION_CONDITION_STATUS_PENDING = 1;
  RECONCILIATION_CONDITION_STATUS_CONVERGED = 2;
  RECONCILIATION_CONDITION_STATUS_RETRYING = 3;
  RECONCILIATION_CONDITION_STATUS_FAILED = 4;
}

// ReconciliationCondition exposes bounded, redaction-safe reconciliation
// truth. reason_code is a stable identifier, never a raw remote error.
message ReconciliationCondition {
  ReconciliationConditionStatus status = 1;
  string reason_code = 2;
  uint32 attempt_count = 3;
  google.protobuf.Timestamp retry_at = 4;
  google.protobuf.Timestamp last_transition_time = 5;
}

message ObservedState {
  string message_id = 1;
  uint64 desired_revision = 2;
  uint64 observed_revision = 3;
  uint64 last_good_revision = 4;
  ReconciliationCondition condition = 5;
}

enum AcknowledgementKind {
  ACKNOWLEDGEMENT_KIND_UNSPECIFIED = 0;
  ACKNOWLEDGEMENT_KIND_DESIRED_STATE = 1;
  ACKNOWLEDGEMENT_KIND_OBSERVED_STATE = 2;
  ACKNOWLEDGEMENT_KIND_HEALTH_REPORT = 3;
}

message Acknowledgement {
  string message_id = 1;
  AcknowledgementKind kind = 2;
  uint64 revision = 3;
}

message ConnectRequest {
  oneof payload {
    EdgeHello hello = 1;
    Heartbeat heartbeat = 2;
    ObservedState observed_state = 3;
    HealthReport health_report = 4;
    Acknowledgement acknowledgement = 5;
  }
}

message ConnectResponse {
  oneof payload {
    ProtocolSelection protocol_selection = 1;
    DesiredStateSnapshot desired_state = 2;
    Acknowledgement acknowledgement = 3;
  }
}
