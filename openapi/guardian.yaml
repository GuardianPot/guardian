openapi: 3.1.0
servers:
  - url: https://api.guardianpot.internal
info:
  title: Guardian API
  version: 0.1.0
  description: Guardian v1 management and canonical telemetry API.
  license:
    name: Proprietary internal software
    identifier: LicenseRef-Guardian-Internal
security:
  - bearerAuth: []
paths:
  /v1/auth/bootstrap:
    post:
      operationId: bootstrapLocalOwner
      summary: Atomically exchange the one-time bootstrap token for the sole owner
      description: >-
        TLS-only. The CLI-created 32-byte token expires after 15 minutes and is
        consumed atomically. This response returns the TOTP provisioning URI
        and ten recovery codes exactly once and does not create a session.
      security:
        - bootstrapToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthBootstrapRequest'
      responses:
        '201':
          description: The pending-MFA owner was created.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthBootstrapResult'
        '401':
          description: The bootstrap exchange was generically denied.
        '426':
          description: TLS is required.
  /v1/auth/login:
    post:
      operationId: loginLocalOwner
      summary: Establish a server-side owner session with password and MFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSessionCredentialsResponse'
        '401':
          description: Authentication was generically denied.
        '429':
          description: Persistent account or source throttling denied the attempt.
        '426':
          description: TLS is required.
  /v1/auth/session:
    get:
      operationId: getLocalSession
      summary: Read the current authenticated owner session
      security:
        - guardianSession: []
      responses:
        '200':
          description: The current server-side session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: The session was denied or expired.
        '426':
          description: TLS is required.
  /v1/auth/logout:
    post:
      operationId: logoutLocalSession
      summary: Revoke and clear the current owner session
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The current session was revoked and its cookie cleared.
        '401':
          description: Session, CSRF, or exact-origin validation failed.
        '426':
          description: TLS is required.
  /v1/auth/sessions:
    get:
      operationId: listLocalSessions
      summary: List at most 200 owner sessions, including revoked history
      security:
        - guardianSession: []
      responses:
        '200':
          description: Newest-first bounded session history.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionPage'
        '401':
          description: The current session was denied.
        '426':
          description: TLS is required.
  /v1/auth/sessions/{sessionId}:
    delete:
      operationId: revokeLocalSession
      summary: Revoke one session owned by the current local owner
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The target session was revoked.
        '401':
          description: Session, CSRF, origin, or target ownership validation failed.
        '426':
          description: TLS is required.
  /v1/auth/password:
    post:
      operationId: changeLocalPassword
      summary: Change the owner password and rotate the current session
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthPasswordChangeRequest'
      responses:
        '200':
          $ref: '#/components/responses/AuthSessionCredentialsResponse'
        '400':
          description: The replacement password does not meet policy.
        '401':
          description: Current password, session, CSRF, or origin validation failed.
        '426':
          description: TLS is required.
  /v1/environments/{environmentId}/enrollment-tokens:
    post:
      operationId: createEnrollmentToken
      summary: Create a one-time device enrollment token
      description: >-
        Requires the approved same-origin operator session, CSRF token, origin,
        and environment scope. The 32-byte Base64URL token is returned once,
        expires after 15 minutes, and is never persisted in plaintext.
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
      responses:
        '201':
          $ref: '#/components/responses/EnrollmentTokenSecretResponse'
        '400':
          description: The bounded request is invalid.
        '401':
          description: The operator authorization boundary denied the request.
        '503':
          description: Device enrollment is not configured.
    get:
      operationId: listEnrollmentTokens
      summary: List non-secret enrollment-token metadata
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
      responses:
        '200':
          description: At most 200 newest-first non-secret token summaries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenPage'
        '401':
          description: The operator authorization boundary denied the request.
  /v1/environments/{environmentId}/enrollment-tokens/{tokenId}:
    delete:
      operationId: revokeEnrollmentToken
      summary: Revoke one unconsumed enrollment token
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/TokenId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The token was atomically revoked.
        '401':
          description: The operator authorization boundary denied the request.
        '409':
          description: The token was not eligible for revocation.
  /v1/environments/{environmentId}/devices/{deviceId}/re-enrollment-token:
    post:
      operationId: createDeviceReenrollmentToken
      summary: Explicitly re-enable a stable device record for re-enrollment
      description: >-
        Permanently revokes all prior active certificates and unconsumed tokens,
        retains the stable device ID, moves the record to pending, and returns
        one new one-time token.
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '201':
          $ref: '#/components/responses/EnrollmentTokenSecretResponse'
        '401':
          description: The operator authorization boundary denied the request.
        '400':
          description: The environment or device identity is invalid.
  /v1/enrollments:
    post:
      operationId: enrollDevice
      summary: Exchange a one-time token and CSR for a device certificate
      description: >-
        TLS-only bootstrap endpoint. It consumes one bearer token atomically,
        applies persistent source/token throttling, and returns only generic
        denials. The Edge private key never crosses this boundary.
      security:
        - enrollmentToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCSRRequest'
      responses:
        '201':
          $ref: '#/components/responses/DeviceCertificateResponse'
        '401':
          description: Enrollment was generically denied.
        '426':
          description: TLS is required.
        '429':
          description: Persistent enrollment throttling denied the attempt.
  /v1/device-certificates:rotate:
    post:
      operationId: rotateDeviceCertificate
      summary: Rotate an eligible device certificate inside its final ten days
      description: >-
        Requires a currently eligible product mTLS identity. Activation of the
        replacement certificate and permanent revocation of the old serial are
        one durable transaction.
      security:
        - deviceMutualTLS: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCSRRequest'
      responses:
        '201':
          $ref: '#/components/responses/DeviceCertificateResponse'
        '401':
          description: The presented device certificate was denied.
        '409':
          description: The certificate or device is not eligible for rotation.
  /v1/environments/{environmentId}/devices/{deviceId}/disable:
    post:
      operationId: disableDevice
      summary: Disable a device and block new authenticated sessions
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The device was disabled.
        '401':
          description: The operator authorization boundary denied the request.
  /v1/environments/{environmentId}/devices/{deviceId}/revoke:
    post:
      operationId: revokeDevice
      summary: Revoke a device and all of its active certificates
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/CSRFToken'
        - $ref: '#/components/parameters/Origin'
      responses:
        '204':
          description: The device and active certificate serials were revoked.
        '401':
          description: The operator authorization boundary denied the request.
  /v1/audit/events:
    get:
      operationId: listAuditEvents
      summary: List append-only audit events
      description: >-
        Returns a newest-first, anchor-stable page of audit events. The
        object_type and object_id filters must be supplied together. When an
        action filter is also present, its approved object type must match the
        object_type filter. Audit events have no product mutation operation.
      security:
        - guardianSession: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          description: Opaque versioned Base64URL keyset cursor from the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9_-]+$'
        - name: action
          in: query
          description: Match one exact Phase 1 audit action.
          schema:
            type: string
            enum:
              - auth.bootstrap_token.created
              - auth.bootstrap.succeeded
              - auth.bootstrap.failed
              - auth.login.succeeded
              - auth.login.failed
              - auth.logout
              - auth.password.changed
              - auth.mfa.enrolled
              - auth.recovery_code.used
              - auth.session.revoked
              - auth.security_setting.changed
              - device.enrollment_token.created
              - device.enrollment_token.revoked
              - device.enrollment.succeeded
              - device.enrollment.failed
              - device.certificate.issued
              - device.certificate.rotated
              - device.disabled
              - device.revoked
              - environment.created
              - environment.updated
              - zone.created
              - zone.updated
              - zone.removed
              - desired_state.revision.published
              - security.action.denied
        - name: correlation_id
          in: query
          description: >-
            Match one exact correlation identity. The server applies the
            limit in UTF-8 bytes and rejects surrounding whitespace and
            control characters.
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: object_type
          in: query
          description: Match one exact object type; object_id is required with it.
          schema:
            type: string
            enum:
              - bootstrap_token
              - user
              - session
              - security_setting
              - enrollment_token
              - device
              - device_certificate
              - environment
              - zone
              - desired_state_revision
              - security_action
        - name: object_id
          in: query
          description: >-
            Match one exact object identity; object_type is required with it.
            The server applies the limit in UTF-8 bytes and rejects
            surrounding whitespace and control characters.
          schema:
            type: string
            minLength: 1
            maxLength: 256
      responses:
        '200':
          description: A deterministic page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          description: A limit, cursor, or filter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: A valid Guardian browser session is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '500':
          description: The audit page could not be read safely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '503':
          description: The audit reader is not available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
  /v1/environments/{environmentId}/health:
    get:
      operationId: getEnvironmentHealth
      summary: Read the current aggregate health for one environment
      description: >-
        Authorization and environment scope are evaluated before any health
        projection read. The operation defaults to 401 until P1-W2 supplies
        the approved browser-session authorizer.
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/EnvironmentId'
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '401':
          description: A valid Guardian browser session is required.
        '403':
          description: The session is not authorized for the environment.
        '404':
          description: No authorized environment health projection exists.
  /v1/devices/{deviceId}/health:
    get:
      operationId: getDeviceHealth
      summary: Read the current health for one device
      description: >-
        Authorization and environment scope are evaluated before any health
        projection read. The operation defaults to 401 until P1-W2 supplies
        the approved browser-session authorizer.
      security:
        - guardianSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '401':
          description: A valid Guardian browser session is required.
        '403':
          description: The session is not authorized for the device environment.
        '404':
          description: No authorized device health projection exists.
  /v1/telemetry:
    post:
      operationId: ingestTelemetry
      summary: Accept a canonical telemetry envelope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/telemetry/v1/telemetry-envelope.schema.json'
      responses:
        '202':
          description: Telemetry accepted for durable processing.
        '400':
          description: The envelope does not satisfy the v1 contract.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    guardianSession:
      type: apiKey
      in: cookie
      name: __Host-guardian_session
      description: >-
        Opaque same-origin Guardian browser session established by local
        authentication. P1-W2 issues it with Secure, HttpOnly, SameSite=Strict,
        Path=/, and no Domain attribute. The audit boundary accepts at most 512
        bytes before handing the opaque value to its authorizer. Health reads
        are authorized by the same server-side owner session.
    bootstrapToken:
      type: http
      scheme: bearer
      bearerFormat: 32-byte Base64URL one-time token
      description: TLS-only, 15-minute, one-time local-owner bootstrap credential.
    enrollmentToken:
      type: http
      scheme: bearer
      bearerFormat: 32-byte Base64URL one-time token
      description: TLS-only enrollment bootstrap credential; never accepted in a URL.
    deviceMutualTLS:
      type: mutualTLS
      description: Active Guardian product device certificate and durable serial eligibility.
  parameters:
    EnvironmentId:
      name: environmentId
      in: path
      required: true
      description: Canonical environment identity.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    DeviceId:
      name: deviceId
      in: path
      required: true
      description: Canonical device identity.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    TokenId:
      name: tokenId
      in: path
      required: true
      description: Canonical enrollment-token record identity.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Server-side local session identity.
      schema:
        type: string
        format: uuid
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 43
        maxLength: 43
        pattern: '^[A-Za-z0-9_-]{43}$'
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2048
  responses:
    AuthSessionCredentialsResponse:
      description: >-
        A rotated opaque Secure, HttpOnly, SameSite=Strict __Host- session
        cookie plus a no-store synchronizer CSRF token for memory-only use.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Set-Cookie:
          required: true
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthSessionCredentials'
    EnrollmentTokenSecretResponse:
      description: A secret enrollment token returned exactly once.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EnrollmentTokenSecret'
    DeviceCertificateResponse:
      description: A product device certificate and public CA certificate.
      headers:
        Cache-Control:
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeviceCertificate'
    HealthResponse:
      description: Current server-projected health truth.
      headers:
        Cache-Control:
          description: Health truth must not be stored by clients or intermediaries.
          required: true
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/HealthView'
  headers:
    NoStore:
      required: true
      schema:
        type: string
        const: no-store
  schemas:
    AuthBootstrapRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: '^[a-z0-9._-]+$'
        password:
          type: string
          minLength: 12
          maxLength: 1024
    AuthBootstrapResult:
      type: object
      additionalProperties: false
      required:
        - user_id
        - username
        - provisioning_uri
        - recovery_codes
      properties:
        user_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        username:
          type: string
          minLength: 3
          maxLength: 64
        provisioning_uri:
          type: string
          format: uri
          pattern: '^otpauth://totp/'
          maxLength: 2048
        recovery_codes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            minLength: 22
            maxLength: 22
            pattern: '^[A-Za-z0-9_-]{22}$'
    AuthLoginRequest:
      type: object
      additionalProperties: false
      required:
        - username
        - password
      oneOf:
        - required: [totp_code]
        - required: [recovery_code]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
        totp_code:
          type: string
          pattern: '^[0-9]{6}$'
        recovery_code:
          type: string
          minLength: 22
          maxLength: 22
          pattern: '^[A-Za-z0-9_-]{22}$'
    AuthPasswordChangeRequest:
      type: object
      additionalProperties: false
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 1024
        new_password:
          type: string
          minLength: 12
          maxLength: 1024
    AuthSessionCredentials:
      type: object
      additionalProperties: false
      required:
        - csrf_token
        - session
      properties:
        csrf_token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        session:
          $ref: '#/components/schemas/AuthSession'
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthSession'
    AuthSessionPage:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuthSession'
    AuthSession:
      type: object
      additionalProperties: false
      required:
        - session_id
        - user_id
        - username
        - role
        - created_at
        - last_seen_at
        - expires_at
        - current
      properties:
        session_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        user_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        username:
          type: string
          minLength: 3
          maxLength: 64
        role:
          type: string
          const: owner
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        current:
          type: boolean
    CreateEnrollmentTokenRequest:
      type: object
      additionalProperties: false
      required:
        - device_name
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 128
    EnrollmentTokenSecret:
      type: object
      additionalProperties: false
      required:
        - token_id
        - device_id
        - environment_id
        - device_name
        - token
        - expires_at
      properties:
        token_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        device_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        environment_id:
          type: string
          format: uuid
        device_name:
          type: string
          minLength: 1
          maxLength: 128
        token:
          type: string
          minLength: 43
          maxLength: 43
          pattern: '^[A-Za-z0-9_-]{43}$'
        expires_at:
          type: string
          format: date-time
    EnrollmentTokenPage:
      type: object
      additionalProperties: false
      required:
        - tokens
      properties:
        tokens:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/EnrollmentTokenSummary'
    EnrollmentTokenSummary:
      type: object
      additionalProperties: false
      required:
        - token_id
        - device_id
        - environment_id
        - device_name
        - expires_at
      properties:
        token_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        device_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        environment_id:
          type: string
          format: uuid
        device_name:
          type: string
          minLength: 1
          maxLength: 128
        expires_at:
          type: string
          format: date-time
        consumed_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
    DeviceCSRRequest:
      type: object
      additionalProperties: false
      required:
        - csr_pem
      properties:
        csr_pem:
          type: string
          minLength: 1
          maxLength: 65536
    DeviceCertificate:
      type: object
      additionalProperties: false
      required:
        - contract_version
        - device_id
        - environment_id
        - certificate_serial
        - certificate_pem
        - ca_certificate_pem
        - not_before
        - not_after
      properties:
        contract_version:
          type: string
          const: guardian.device.v1
        device_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        environment_id:
          type: string
          format: uuid
        certificate_serial:
          type: string
          pattern: '^[0-9a-f]{1,32}$'
        certificate_pem:
          type: string
          minLength: 1
          maxLength: 32768
        ca_certificate_pem:
          type: string
          minLength: 1
          maxLength: 16384
        not_before:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
    AuditEventPage:
      type: object
      additionalProperties: false
      required:
        - events
      properties:
        events:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: string
          description: Opaque cursor for the next page; absent on the final page.
          minLength: 1
          maxLength: 128
          pattern: '^[A-Za-z0-9_-]+$'
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - event_id
        - occurred_at
        - recorded_at
        - actor
        - action
        - object
        - correlation_id
      properties:
        event_id:
          type: string
          format: uuid
          description: PostgreSQL 18-generated, canonical lowercase UUIDv7.
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        actor:
          $ref: '#/components/schemas/AuditActor'
        action:
          type: string
          enum:
            - auth.bootstrap_token.created
            - auth.bootstrap.succeeded
            - auth.bootstrap.failed
            - auth.login.succeeded
            - auth.login.failed
            - auth.logout
            - auth.password.changed
            - auth.mfa.enrolled
            - auth.recovery_code.used
            - auth.session.revoked
            - auth.security_setting.changed
            - device.enrollment_token.created
            - device.enrollment_token.revoked
            - device.enrollment.succeeded
            - device.enrollment.failed
            - device.certificate.issued
            - device.certificate.rotated
            - device.disabled
            - device.revoked
            - environment.created
            - environment.updated
            - zone.created
            - zone.updated
            - zone.removed
            - desired_state.revision.published
            - security.action.denied
        object:
          $ref: '#/components/schemas/AuditObject'
        correlation_id:
          type: string
          description: >-
            Required correlation identity; maximum is 128 UTF-8 bytes, with
            no surrounding whitespace or control characters.
          minLength: 1
          maxLength: 128
        request_id:
          type: string
          description: >-
            Optional request identity; maximum is 128 UTF-8 bytes, with no
            surrounding whitespace or control characters.
          minLength: 1
          maxLength: 128
        before:
          $ref: '#/components/schemas/AuditSnapshot'
        after:
          $ref: '#/components/schemas/AuditSnapshot'
    AuditActor:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - system
            - user
            - device
        id:
          type: string
          description: >-
            Actor identity; maximum is 256 UTF-8 bytes, with no surrounding
            whitespace or control characters.
          minLength: 1
          maxLength: 256
    AuditObject:
      type: object
      additionalProperties: false
      required:
        - type
        - id
      properties:
        type:
          type: string
          enum:
            - bootstrap_token
            - user
            - session
            - security_setting
            - enrollment_token
            - device
            - device_certificate
            - environment
            - zone
            - desired_state_revision
            - security_action
        id:
          type: string
          description: >-
            Object identity; maximum is 256 UTF-8 bytes, with no surrounding
            whitespace or control characters.
          minLength: 1
          maxLength: 256
    AuditSnapshot:
      type: object
      description: >-
        Canonical redacted snapshot envelope. Each encoded envelope is at most
        16 KiB, with maximum depth 6, 256 total data nodes, 64 members per
        object or array, 64 UTF-8 bytes per key, and 512 UTF-8 bytes per string.
        Unsupported or over-limit projections reject the containing mutation;
        values are never silently truncated.
      additionalProperties: false
      required:
        - schema
        - data
      properties:
        schema:
          type: string
          const: guardian.audit.snapshot.v1
        data:
          type: object
          description: Bounded, recursively redacted safe projection.
          additionalProperties: true
    StatusResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
    HealthView:
      type: object
      additionalProperties: false
      required:
        - aggregate
        - conditions
        - received_at
      properties:
        aggregate:
          $ref: '#/components/schemas/HealthAggregate'
        conditions:
          type: array
          minItems: 8
          maxItems: 8
          description: All eight blocking conditions in canonical order.
          items:
            $ref: '#/components/schemas/HealthCondition'
        received_at:
          type: string
          format: date-time
          description: Trusted Control Plane receipt time used for staleness.
    HealthAggregate:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        blocking_type:
          $ref: '#/components/schemas/HealthConditionType'
        reason:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]{0,63}$'
    HealthCondition:
      type: object
      additionalProperties: false
      required:
        - type
        - status
        - reason
        - message
        - last_transition_time
      properties:
        type:
          $ref: '#/components/schemas/HealthConditionType'
        status:
          $ref: '#/components/schemas/HealthStatus'
        reason:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z][a-z0-9_]{0,63}$'
        message:
          type: string
          maxLength: 512
          description: >-
            Secret-free plain UTF-8 text. The UI renders this value only as
            escaped text; runtime validators enforce the 512-byte limit.
        observed_revision:
          type: integer
          minimum: 0
          maximum: 18446744073709551615
        last_transition_time:
          type: string
          format: date-time
    HealthConditionType:
      type: string
      enum:
        - edge_connected
        - device_certificate_ready
        - config_converged
        - local_database_healthy
        - spool_healthy
        - clock_quality
        - container_runtime_reachable
        - privileged_helper_reachable
    HealthStatus:
      type: string
      enum:
        - 'True'
        - 'False'
        - 'Unknown'
