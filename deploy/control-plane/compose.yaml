services:
  postgres:
    image: postgres:18.6-trixie@sha256:06cad38a5d9f5d24b4d83d86def30795d5e4b757fedbf5281172b576dedcd941
    environment:
      POSTGRES_DB: ${GUARDIAN_POSTGRES_DB:-guardian}
      POSTGRES_USER: ${GUARDIAN_POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${GUARDIAN_POSTGRES_PASSWORD:?set GUARDIAN_POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${GUARDIAN_POSTGRES_PORT:-55432}:5432"
    volumes:
      - guardian-postgres-data:/var/lib/postgresql
    tmpfs:
      - /var/run/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: "no"

volumes:
  guardian-postgres-data:
