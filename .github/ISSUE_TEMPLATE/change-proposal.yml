name: Change proposal
description: Propose a change to an approved scope, architecture, contract, or policy.
title: "[Change proposal] "
labels:
  - change-proposal
body:
  - type: input
    id: decision
    attributes:
      label: Affected decision or document
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Proposed change and rationale
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Product, architecture, security, and acceptance impact
    validations:
      required: true
