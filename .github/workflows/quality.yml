name: quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
      - name: Setup Buf
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99
        with:
          version: '1.72.0'
      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.53.1
      - name: Install dependencies
        run: npm ci
      - name: Repository policy
        run: task policy
      - name: Markdown format
        run: task format:check
      - name: Contract layout
        run: task contracts
      - name: Go checks
        run: task go:check
      - name: Web checks
        run: task web:check
      - name: Container smoke build
        run: task container:check
      - name: Buf breaking signal
        continue-on-error: true
        run: node tools/check-buf-breaking.mjs
      - name: Secret pattern scan
        run: npm run security:check
