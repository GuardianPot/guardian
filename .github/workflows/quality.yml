name: quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Nightly full sweep, so anything skipped on a pull request still runs
    # against main every day.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `full` means run every job regardless of which paths changed.
  FULL: ${{ github.event_name != 'pull_request' }}

jobs:
  changes:
    name: Changed areas
    runs-on: ubuntu-24.04
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      contracts: ${{ steps.filter.outputs.contracts }}
      container: ${{ steps.filter.outputs.container }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Detect changed areas
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL: ${{ env.FULL }}
        run: bash .github/scripts/changed-areas.sh

  fast:
    name: Fast gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Repository policy
        run: npm run policy:check
      - name: Markdown format
        run: npm run format:check
      - name: Contract layout
        run: npm run contracts:check
      - name: Generated artifact freshness
        run: npm run generated:check
      - name: Dependency policy
        run: npm run dependencies:check
      - name: Workflow pins
        run: npm run workflow:check
      - name: Secret pattern scan
        run: npm run security:check

  web:
    name: Web Console
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck -w @guardianpot/web-console
      - name: Lint
        run: npm run lint -w @guardianpot/web-console
      - name: Unit and component tests
        run: npm run test -w @guardianpot/web-console
      - name: Build
        run: npm run build -w @guardianpot/web-console
      - name: Bundle budget
        run: npm run bundle:check -w @guardianpot/web-console

  go:
    name: Go and integration
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
      - name: Restore pinned Go tools
        id: gotools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin
          key: gotools-${{ runner.os }}-task3.53.1-buf1.72.0
      - name: Install pinned Go tools
        if: steps.gotools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - name: Put Go tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Go checks
        run: task go:check
      - name: Control Plane PostgreSQL integration
        run: task control-plane:integration
      - name: Health durability and failure-injection integration
        run: task health:integration

  browser:
    name: Browser E2E
    needs: [changes, web]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
      - name: Restore pinned Go tools
        id: gotools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin
          key: gotools-${{ runner.os }}-task3.53.1-buf1.72.0
      # `task web:e2e:run` depends on control-plane:generated and
      # privileged:generated, which run sqlc and `buf generate`, so this job
      # needs the same tool set as the Go job.
      - name: Install pinned Go tools
        if: steps.gotools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - name: Put Go tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Cache browser engines
        id: playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ env.FULL }}
      # A pull request proves the flow in one engine. The nightly run and every
      # push to main prove it in all three, so cross-engine regressions are
      # caught within a day rather than on every commit.
      - name: Install browser engines
        run: |
          if [ "${FULL}" = "true" ]; then
            npx playwright install --with-deps chromium firefox webkit
          else
            npx playwright install --with-deps chromium
          fi
      - name: Web Console real browser onboarding
        env:
          GUARDIAN_E2E_ARTIFACT_DIR: ${{ runner.temp }}/guardian-web-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          GUARDIAN_E2E_PROJECTS: ${{ env.FULL == 'true' && 'chromium firefox webkit' || 'chromium' }}
        run: task web:e2e:run
      - name: Upload redacted Web Console evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-browser-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/guardian-web-evidence-${{ github.run_id }}-${{ github.run_attempt }}/screenshots/*.png
          if-no-files-found: error
          retention-days: 7

  contracts:
    name: Contracts and container
    needs: changes
    if: needs.changes.outputs.contracts == 'true' || needs.changes.outputs.container == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.0'
      - name: Restore pinned Go tools
        id: gotools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin
          key: gotools-${{ runner.os }}-task3.53.1-buf1.72.0
      - name: Install pinned Go tools
        if: steps.gotools.outputs.cache-hit != 'true'
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.53.1
          go install github.com/bufbuild/buf/cmd/buf@v1.72.0
      - name: Put Go tools on PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: npm ci
      - name: Contract tooling
        run: task contracts
      - name: Buf breaking regression tests
        run: node --test tools/check-buf-breaking.test.mjs
      - name: Buf breaking signal
        env:
          GUARDIAN_BUF_BASE_REF: ${{ github.event.pull_request.base.sha || github.sha }}
        run: node tools/check-buf-breaking.mjs
      - name: Container smoke build
        if: needs.changes.outputs.container == 'true'
        run: task container:check
      - name: Cowrie adapter fixture
        if: needs.changes.outputs.container == 'true'
        run: bash tools/cowrie-fixture.sh
